services:
  postgres:
    image: postgres:16
    container_name: gerenciamento-db
    environment:
      POSTGRES_DB: gerenciamento
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - gerenciamento_data:/var/lib/postgresql/data

volumes:
  gerenciamento_data: